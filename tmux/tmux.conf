################################################################################
# Keybinds
################################################################################

# change <Ctrl + B> to <Ctrl + X> as the command button
unbind C-b
set-option -g prefix C-x
bind C-x send-prefix

# remap window split bindings; now new shell opens in current directory
bind-key v split-window -h  -c "#{pane_current_path}"
bind-key h split-window -v  -c "#{pane_current_path}"
bind-key V split-window -hf -c "#{pane_current_path}"
bind-key H split-window -f  -c "#{pane_current_path}"
bind-key c new-window       -c "#{pane_current_path}"

# map window cycle left/right commands to keys (no prefix and repeat)
bind -n -r S-Left previous-window
bind -n -r S-Right next-window

# remap some Ctrl+ combination to send keys directly
bind C-l send-keys 'C-l'
bind C-c send-keys 'C-c'
bind C-z send-keys 'C-z'

################################################################################
# Configuration
################################################################################

# set Zsh as your default Tmux shell
set-option -g default-shell /bin/zsh

# bug in xterm-kitty; need to manually bind Home and End keys
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# fixes continuous keydown event perception
set -g repeat-time 1000

# increase scroll-back history
set -g history-limit 5000

# enable mouse interactivity
set -g mouse on

# set mode-keys to vi (default is emacs)
set -g mode-keys vi

# v, y and p as in vim
set -g set-clipboard on
set -g @yank_action 'copy-pipe'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind Escape copy-mode
unbind p
bind p paste-buffer

################################################################################
# Plugins
################################################################################

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'erikw/tmux-powerline'

# initialize tmux plugin manager (keep this line at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

